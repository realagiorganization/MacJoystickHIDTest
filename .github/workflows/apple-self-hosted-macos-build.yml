name: Apple Self-Hosted macOS Build

on:
  push:
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: [self-hosted, macOS, ARM64, macjoystickhidtest]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Check Xcode toolchain
        run: |
          xcode-select -p
          xcodebuild -version
      - name: Build JoystickHIDTest macOS app
        run: |
          xcodebuild \
            -project JoystickHIDTest.xcodeproj \
            -scheme JoystickHIDTest \
            -configuration Debug \
            -destination 'generic/platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build
